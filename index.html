<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Компас населених пунктів</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; font-family: Arial, sans-serif; }
  body { overflow: hidden; }
  #map { position: absolute; inset: 0; background: #e8e8e8; }

  .panel {
    position: absolute; z-index: 1000; top: 10px; left: 10px; right: 10px;
    max-height: 48vh; overflow-y: auto; background: rgba(255,255,255,.96);
    border-radius: 12px; padding: 12px; box-shadow: 0 2px 12px #0003;
  }
  h2 { font-size: 18px; margin: 0 0 8px; }
  .status { font-size: 13px; color: #444; margin: 5px 0 9px; line-height: 1.35; }
  .buttons { display: flex; gap: 8px; margin-bottom: 10px; }
  button {
    border: 0; border-radius: 8px; padding: 10px 12px; font-size: 14px;
    background: #1769d2; color: white; cursor: pointer;
  }
  button.secondary { background: #555; }
  .control { margin: 9px 0; }
  .control label { display: flex; justify-content: space-between; font-size: 13px; gap: 10px; }
  input[type="range"] { width: 100%; margin: 7px 0 0; }
  #places { margin: 8px 0 0; padding: 0; list-style: none; }
  #places li {
    padding: 9px 3px; border-top: 1px solid #ddd; font-size: 14px;
    display: flex; justify-content: space-between; gap: 10px; cursor: pointer;
  }
  #places li span:last-child { white-space: nowrap; color: #555; }
  .small { font-size: 12px; color: #555; }
  .gps-arrow {
    width: 42px; height: 52px; position: relative;
    filter: drop-shadow(0 1px 2px #0008);
  }
  .gps-arrow svg { width: 42px; height: 52px; display: block; }
  .leaflet-marker-icon.gps-marker { background: transparent; border: 0; }
  @media (max-height: 650px) {
    .panel { max-height: 43vh; padding: 9px; }
    .control { margin: 6px 0; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="panel">
  <h2>Компас населених пунктів</h2>
  <div id="status" class="status">Очікування GPS… Дозволь доступ до місцезнаходження.</div>

  <div class="buttons">
    <button id="locateBtn">Моє місце</button>
    <button id="refreshBtn" class="secondary">Оновити список</button>
  </div>

  <div class="control">
    <label for="radius">
      <span>Радіус пошуку</span>
      <strong><span id="radiusValue">50</span> км</strong>
    </label>
    <input id="radius" type="range" min="1" max="50" value="50">
  </div>

  <div class="control">
    <label for="angle">
      <span>Кут пошуку від напрямку стрілки</span>
      <strong>±<span id="angleValue">15</span>°</strong>
    </label>
    <input id="angle" type="range" min="1" max="90" value="15">
  </div>

  <div id="listStatus" class="small">Населені пункти ще не завантажено.</div>
  <ul id="places"></ul>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@tomickigrzegorz/leaflet-rotate/dist/leaflet-rotate.umd.min.js"></script>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const statusEl = $("status");
  const listStatusEl = $("listStatus");
  const placesEl = $("places");

  let userPosition = null;
  let gpsMarker = null;
  let accuracyCircle = null;
  let currentHeading = null;
  let smoothedHeading = null;
  let headingSamples = [];
  let allSettlements = [];
  let lastFetchPosition = null;
  let lastFetchTime = 0;
  let fetchInProgress = false;
  let fetchAgain = false;
  let watchId = null;
  let lastListUpdate = 0;
  let listTimer = null;

  const map = L.map("map", {
    rotate: true,
    touchRotate: false,
    shiftKeyRotate: false,
    dragRotate: false,
    rotateControl: false,
    zoomControl: true
  }).setView([50.4501, 30.5234], 10);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Стрілка є GPS-маркером: вона прив'язана до координат на карті.
  const arrowIcon = L.divIcon({
    className: "gps-marker",
    iconSize: [42, 52],
    iconAnchor: [21, 26],
    html: `<div class="gps-arrow">
      <svg viewBox="0 0 42 52" aria-hidden="true">
        <path d="M21 2 L36 34 L21 27 L6 34 Z"
          fill="#0878ff" stroke="white" stroke-width="2"
          stroke-linejoin="round"/>
        <circle cx="21" cy="27" r="5" fill="#fff" stroke="#0878ff" stroke-width="2"/>
      </svg>
    </div>`
  });

  function normalizeAngle(value) {
    return ((value % 360) + 360) % 360;
  }

  function angleDifference(a, b) {
    return ((a - b + 540) % 360) - 180;
  }

  function smoothHeading(value) {
    value = normalizeAngle(value);
    headingSamples.push(value);
    if (headingSamples.length > 7) headingSamples.shift();

    // Усереднюємо кути через синус і косинус, щоб 359°/1° не смикали стрілку.
    let x = 0, y = 0;
    for (const a of headingSamples) {
      x += Math.cos(a * Math.PI / 180);
      y += Math.sin(a * Math.PI / 180);
    }
    const average = normalizeAngle(Math.atan2(y, x) * 180 / Math.PI);

    if (smoothedHeading === null) {
      smoothedHeading = average;
    } else {
      const delta = angleDifference(average, smoothedHeading);
      // Приглушуємо дрібні коливання датчика.
      if (Math.abs(delta) < 1.2) return smoothedHeading;
      smoothedHeading = normalizeAngle(smoothedHeading + delta * 0.18);
    }

    return smoothedHeading;
  }

  function updateArrowRotation() {
    if (!gpsMarker || currentHeading === null) return;

    // Маркер повертається разом із картою. При heading-up карта
    // компенсує поворот, тому стрілка показує напрямок до верхнього краю екрана.
    gpsMarker.options.rotation = currentHeading;
    if (typeof gpsMarker.update === "function") gpsMarker.update();
  }

  function applyHeading(degrees) {
    currentHeading = smoothHeading(degrees);

    // ease нижче — згладжування повороту самої карти.
    if (typeof map.setHeading === "function") {
      map.setHeading(currentHeading, { ease: 0.12, deadzone: 1.2 });
    } else {
      statusEl.textContent =
        "Плагін повороту карти не завантажився. Перевір інтернет-з'єднання.";
    }

    updateArrowRotation();
    scheduleListUpdate();
  }

  function distanceMeters(a, b) {
    const R = 6371000;
    const rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad;
    const dLon = (b.lon - a.lon) * rad;
    const lat1 = a.lat * rad;
    const lat2 = b.lat * rad;
    const h = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(Math.min(1, h)));
  }

  function bearingDegrees(a, b) {
    const rad = Math.PI / 180;
    const lat1 = a.lat * rad, lat2 = b.lat * rad;
    const dLon = (b.lon - a.lon) * rad;
    const y = Math.sin(dLon) * Math.cos(lat2);
    const x = Math.cos(lat1) * Math.sin(lat2) -
      Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
    return normalizeAngle(Math.atan2(y, x) / rad);
  }

  function formatDistance(meters) {
    if (meters < 1000) return `${Math.round(meters)} м`;
    return `${(meters / 1000).toFixed(1).replace(".", ",")} км`;
  }

  function getRadiusKm() {
    return Number($("radius").value);
  }

  function getAngle() {
    return Number($("angle").value);
  }

  function scheduleListUpdate() {
    if (listTimer) return;
    listTimer = setTimeout(() => {
      listTimer = null;
      updateSettlementList();
    }, 350);
  }

  function updateSettlementList() {
    if (!userPosition) return;

    const now = Date.now();
    if (now - lastListUpdate < 250) return;
    lastListUpdate = now;

    const radius = getRadiusKm() * 1000;
    const angle = getAngle();
    const heading = currentHeading;

    const matches = allSettlements.map(place => {
      const distance = distanceMeters(userPosition, place);
      const bearing = bearingDegrees(userPosition, place);
      const diff = heading === null ? 0 : Math.abs(angleDifference(bearing, heading));
      return { ...place, distance, bearing, diff };
    }).filter(place =>
      place.distance > 20 &&
      place.distance <= radius &&
      (heading === null || place.diff <= angle)
    ).sort((a, b) => a.distance - b.distance);

    placesEl.replaceChildren();

    if (!allSettlements.length) {
      listStatusEl.textContent = "Очікуємо дані про населені пункти.";
      return;
    }

    if (!matches.length) {
      listStatusEl.textContent = heading === null
        ? "У вибраному радіусі населених пунктів не знайдено."
        : `У секторі ±${angle}° попереду немає населених пунктів. Спробуй збільшити кут або радіус.`;
      return;
    }

    listStatusEl.textContent = `Знайдено: ${matches.length}. Напрямок: ${
      heading === null ? "очікується компас" : Math.round(heading) + "°"
    }.`;

    for (const place of matches) {
      const li = document.createElement("li");
      const name = document.createElement("span");
      const dist = document.createElement("span");
      name.textContent = place.name;
      dist.textContent = `${formatDistance(place.distance)} · ${Math.round(place.bearing)}°`;
      li.append(name, dist);
      li.addEventListener("click", () => {
        map.setView([place.lat, place.lon], Math.max(map.getZoom(), 13));
      });
      placesEl.appendChild(li);
    }
  }
function deduplicateSettlements(items) {
    const result = [];
    const seen = new Map();

    for (const item of items) {
      if (!item.name || !Number.isFinite(item.lat) || !Number.isFinite(item.lon)) continue;

      const key = item.name.toLocaleLowerCase("uk").trim()
        .replace(/[’'`]/g, "")
        .replace(/\s+/g, " ");

      const previous = seen.get(key);
      if (previous && distanceMeters(previous, item) < 600) continue;

      seen.set(key, item);
      result.push(item);
    }
    return result;
  }

  async function fetchOverpass(url, query, signal) {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
      body: "data=" + encodeURIComponent(query),
      signal
    });

    if (!response.ok) throw new Error(`Сервер відповів ${response.status}`);
    const data = await response.json();
    if (!Array.isArray(data.elements)) throw new Error("Невірний формат відповіді");
    return data.elements;
  }

  async function loadSettlements(force = false) {
    if (!userPosition) return;

    const now = Date.now();
    const movedEnough = !lastFetchPosition ||
      distanceMeters(lastFetchPosition, userPosition) >= 3000;
    const timePassed = now - lastFetchTime >= 180000;

    if (!force && !movedEnough && !timePassed) {
      scheduleListUpdate();
      return;
    }

    if (fetchInProgress) {
      fetchAgain = fetchAgain || force;
      return;
    }

    fetchInProgress = true;
    lastFetchTime = now;
    const requestedPosition = { ...userPosition };
    const radius = getRadiusKm() * 1000;

    listStatusEl.textContent = "Завантажую населені пункти…";

    const query = `
      [out:json][timeout:25];
      (
        node(around:${radius},${requestedPosition.lat},${requestedPosition.lon})["place"~"city|town|village|hamlet|isolated_dwelling|suburb"];
        way(around:${radius},${requestedPosition.lat},${requestedPosition.lon})["place"~"city|town|village|hamlet|isolated_dwelling|suburb"];
        relation(around:${radius},${requestedPosition.lat},${requestedPosition.lon})["place"~"city|town|village|hamlet|isolated_dwelling|suburb"];
      );
      out center tags;
    `;

    const servers = [
      "https://overpass-api.de/api/interpreter",
      "https://overpass.kumi.systems/api/interpreter",
      "https://overpass.private.coffee/api/interpreter"
    ];

    let loaded = false;
    let lastError = null;

    try {
      for (const server of servers) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        try {
          const elements = await fetchOverpass(server, query, controller.signal);
          clearTimeout(timeoutId);

          const parsed = elements.map(element => {
            const tags = element.tags || {};
            const center = element.center || {};
            const lat = element.lat ?? center.lat;
            const lon = element.lon ?? center.lon;
            const name = tags.name || tags["name:uk"] || tags["name:en"];

            if (!name || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;
            return { name, lat, lon };
          }).filter(Boolean);

          // Зберігаємо старі результати, якщо нова відповідь порожня,
          // щоб тимчасова неповна відповідь не стирала список.
          if (parsed.length > 0 || allSettlements.length === 0) {
            allSettlements = deduplicateSettlements(parsed);
          }

          lastFetchPosition = requestedPosition;
          loaded = true;
          break;
        } catch (error) {
          clearTimeout(timeoutId);
          lastError = error;
        }
      }

      if (loaded) {
        listStatusEl.textContent = `Дані оновлено. Населених пунктів у базі: ${allSettlements.length}.`;
        scheduleListUpdate();
      } else {
        listStatusEl.textContent =
          "Не вдалося зв'язатися із серверами даних. Старий список збережено; спробуй оновити пізніше.";
        console.warn("Overpass error:", lastError);
      }
    } finally {
      fetchInProgress = false;

      if (fetchAgain) {
        fetchAgain = false;
        setTimeout(() => loadSettlements(true), 1500);
      }
    }
  }

  function updateGps(position) {
    userPosition = {
      lat: position.coords.latitude,
      lon: position.coords.longitude
    };

    const accuracy = position.coords.accuracy || 0;
    const latlng = [userPosition.lat, userPosition.lon];

    if (!gpsMarker) {
      gpsMarker = L.marker(latlng, {
        icon: arrowIcon,
        rotation: currentHeading || 0,
        rotateWithView: true,
        zIndexOffset: 1000,
        keyboard: false
      }).addTo(map);

      // Перше GPS-позиціювання центрує карту; подальші оновлення
      // не перетягують карту, якщо користувач сам її рухає.
      map.setView(latlng, 13);
    } else {
      gpsMarker.setLatLng(latlng);
    }

    if (!accuracyCircle) {
      accuracyCircle = L.circle(latlng, {
        radius: accuracy,
        color: "#0878ff",
        weight: 1,
        fillColor: "#0878ff",
        fillOpacity: 0.08,
        interactive: false
      }).addTo(map);
    } else {
      accuracyCircle.setLatLng(latlng);
      accuracyCircle.setRadius(accuracy);
    }

    updateArrowRotation();

    statusEl.textContent =
      `GPS: точність приблизно ${Math.round(accuracy)} м. ` +
      (currentHeading === null
        ? "Очікування компаса — дозволь доступ до датчиків руху."
        : `Напрямок: ${Math.round(currentHeading)}°.`);

    scheduleListUpdate();
    loadSettlements(false);
  }

  function gpsError(error) {
    const messages = {
      1: "Доступ до GPS заборонено. Дозволь місцезнаходження в налаштуваннях браузера.",
      2: "GPS тимчасово недоступний. Перевір сигнал і налаштування місцезнаходження.",
      3: "GPS не відповів вчасно. Спробую отримати позицію знову."
    };
    statusEl.textContent = messages[error.code] || "Не вдалося отримати GPS.";
  }

  function startGps() {
    if (!("geolocation" in navigator)) {
      statusEl.textContent = "Цей браузер не підтримує GPS.";
      return;
    }

    if (watchId !== null) navigator.geolocation.clearWatch(watchId);

    watchId = navigator.geolocation.watchPosition(
      updateGps,
      gpsError,
      { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 }
    );
  }

  function handleOrientation(event) {
    let heading = null;

    // iPhone Safari надає окремий компасний кут.
    if (typeof event.webkitCompassHeading === "number") {
      heading = event.webkitCompassHeading;
    } else if (typeof event.alpha === "number" && event.absolute === true) {
      // Для Android це працює на пристроях, які надсилають абсолютний азимут.
      heading = 360 - event.alpha;
    }

    if (heading !== null && Number.isFinite(heading)) {
      applyHeading(normalizeAngle(heading));
    }
  }

  async function startCompass() {
    try {
      if (typeof DeviceOrientationEvent === "undefined") {
        statusEl.textContent = "Цей пристрій не надає дані компаса.";
        return;
      }

      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== "granted") {
          statusEl.textContent = "Доступ до компаса не надано.";
          return;
        }
      }

      window.addEventListener("deviceorientation", handleOrientation, true);
      statusEl.textContent = "Компас увімкнено. Очікування даних датчика…";
    } catch (error) {
      statusEl.textContent = "Не вдалося увімкнути компас. Перевір дозволи браузера.";
      console.warn(error);
    }
  }

  $("locateBtn").addEventListener("click", () => {
    if (!userPosition) {
      startGps();
      return;
    }
    map.setView([userPosition.lat, userPosition.lon], Math.max(map.getZoom(), 13), {
      animate: true
    });
  });

  $("refreshBtn").addEventListener("click", () => loadSettlements(true));

  $("radius").addEventListener("input", () => {
    $("radiusValue").textContent = $("radius").value;
    scheduleListUpdate();
  });

  $("angle").addEventListener("input", () => {
    $("angleValue").textContent = $("angle").value;
    scheduleListUpdate();
  });

  // Починаємо GPS одразу. На iPhone дозвіл на компас
  // запитується після натискання кнопки, бо браузер цього вимагає.
  startGps();

  // Натискання кнопки «Моє місце» також запускає запит дозволу компаса.
  $("locateBtn").addEventListener("click", startCompass, { once: true });

  // Додатково пробуємо під'єднати компас на пристроях без окремого дозволу.
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission !== "function") {
    startCompass();
  }

  // Періодична перевірка не змушує карту центруватися повторно.
  setInterval(() => {
    if (userPosition) loadSettlements(false);
  }, 30000);

})();
</script>
</body>
</html>
