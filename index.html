
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Калькулятор робочих днів</title>

    <style>
        :root {
            --bg: #050014;
            --card: #10002b;
            --text: #ffffff;
            --secondary: #bda9ff;
            --accent: #00f7ff;
            --input: #1b0640;
            --border: #7d2cff;
            --error: #ff4d6d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            font-family: Arial, sans-serif;
            color: var(--text);

            background:
                radial-gradient(circle at top left, #24005c, transparent 35%),
                radial-gradient(circle at bottom right, #001f3f, transparent 35%),
                var(--bg);

            transition: 0.4s ease;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 35px;
            background: var(--card);
            border: 1px solid var(--accent);
            border-radius: 24px;

            box-shadow:
                0 0 20px rgba(0, 247, 255, 0.3),
                0 0 60px rgba(125, 44, 255, 0.25);

            animation: appear 0.7s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
            font-size: 30px;
            text-shadow:
                0 0 10px var(--accent),
                0 0 25px var(--accent);
        }

        .mode {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .mode button {
            flex: 1;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            background: var(--input);
            color: var(--text);
            transition: 0.3s ease;
        }

        .mode button:hover {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent);
        }

        .mode button.active {
            background: var(--accent);
            color: #000000;
            box-shadow: 0 0 15px var(--accent);
        }

        select,
        input[type="date"],
        input[type="number"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: var(--input);
            color: var(--text);
            font-size: 16px;
            transition: 0.3s ease;
        }

        select:focus,
        input[type="date"]:focus,
        input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent);
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--secondary);
            font-size: 14px;
        }

        .period {
            display: none;
        }

        .period.active {
            display: block;
        }

        /* НОВІ НАЛАШТУВАННЯ ЗАРПЛАТИ */

        .settings {
            margin-top: 10px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--input);
        }

        .settings-title {
            margin-top: 0;
            margin-bottom: 18px;
            color: var(--accent);
            font-size: 18px;
        }

        .advance-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0 15px;
            color: var(--secondary);
            cursor: pointer;
        }

        .advance-toggle input {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        .result {
            margin-top: 25px;
            padding: 22px;
            border-radius: 15px;
            background: var(--input);

            box-shadow:
                inset 0 0 15px rgba(125, 44, 255, 0.2);

            line-height: 2;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--secondary);
        }

        .result-row strong {
            color: var(--text);
            text-align: right;
        }

        .work-days {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            font-size: 25px;
            font-weight: bold;
            color: var(--text);
        }

        .work-days span {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
        }

        .salary {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 27px;
            font-weight: bold;
            color: var(--accent);

            text-shadow:
                0 0 10px var(--accent),
                0 0 25px var(--accent);
        }

        .error {
            margin-top: 10px;
            color: var(--error);
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }

            .work-days {
                font-size: 22px;
            }

            .salary {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Калькулятор робочих днів</h1>

        <!-- ВИБІР РЕЖИМУ -->

        <div class="mode">
            <button id="monthModeBtn" class="active">
                Один місяць
            </button>

            <button id="periodModeBtn">
                Свій період
            </button>
        </div>

        <!-- РЕЖИМ ОДНОГО МІСЯЦЯ -->

        <div id="monthMode" class="period active">

            <select id="month">
                <option value="0">Січень</option>
                <option value="1">Лютий</option>
                <option value="2">Березень</option>
                <option value="3">Квітень</option>
                <option value="4">Травень</option>
                <option value="5">Червень</option>
                <option value="6">Липень</option>
                <option value="7">Серпень</option>
                <option value="8">Вересень</option>
                <option value="9">Жовтень</option>
                <option value="10">Листопад</option>
                <option value="11">Грудень</option>
            </select>

            <select id="year"></select>

        </div>

        <!-- РЕЖИМ ВЛАСНОГО ПЕРІОДУ -->

        <div id="customMode" class="period">

            <label for="startDate">Дата початку</label>
            <input type="date" id="startDate">

            <label for="endDate">Дата завершення</label>
            <input type="date" id="endDate">

        </div>

        <!-- НАЛАШТУВАННЯ ЗАРПЛАТИ -->

        <div class="settings">

            <h2 class="settings-title">Налаштування зарплати</h2>

            <label for="salaryPerDay">
                Зарплата за один робочий день (грн)
            </label>

            <input
                type="number"
                id="salaryPerDay"
                min="0"
                step="1"
                value="950"
            >

            <label for="missedDays">
                Кількість пропущених днів
            </label>

            <select id="missedDays">
                <option value="0" selected>0 днів</option>
                <option value="1">1 день</option>
                <option value="2">2 дні</option>
                <option value="3">3 дні</option>
                <option value="4">4 дні</option>
                <option value="5">5 днів</option>
            </select>

            <label class="advance-toggle" for="advanceEnabled">
                <input type="checkbox" id="advanceEnabled">
                <span>Аванс (відняти від зарплати)</span>
            </label>

            <div id="advanceSettings" style="display: none;">

                <label for="advanceAmount">
                    Сума авансу (грн)
                </label>

                <input
                    type="number"
                    id="advanceAmount"
                    min="0"
                    step="1"
                    value="3000"
                >

            </div>

        </div>

        <!-- РЕЗУЛЬТАТ -->

        <div class="result">

            <div class="result-row">
                <span>Всього днів:</span>
                <strong id="totalDays">0</strong>
            </div>

            <div class="result-row">
                <span>Неділь:</span>
                <strong id="sundays">0</strong>
            </div>

            <div class="work-days">
                Робочих днів:
                <span id="workDays">0</span>
            </div>

            <div class="salary">
                Зарплата:
                <span id="salary">0</span>
                грн
            </div>

            <div id="error" class="error"></div>

        </div>

    </div>

    <script>

        /* НАЛАШТУВАННЯ */

        const defaultSalaryPerDay = 950;
        const defaultAdvance = 3000;

        /* ОТРИМАННЯ ЕЛЕМЕНТІВ */

        const monthModeBtn = document.getElementById("monthModeBtn");
        const periodModeBtn = document.getElementById("periodModeBtn");

        const monthMode = document.getElementById("monthMode");
        const customMode = document.getElementById("customMode");

        const monthSelect = document.getElementById("month");
        const yearSelect = document.getElementById("year");

        const startDateInput = document.getElementById("startDate");
        const endDateInput = document.getElementById("endDate");

        const salaryPerDayInput = document.getElementById("salaryPerDay");
        const missedDaysSelect = document.getElementById("missedDays");

        const advanceEnabled = document.getElementById("advanceEnabled");
        const advanceAmountInput = document.getElementById("advanceAmount");
        const advanceSettings = document.getElementById("advanceSettings");

        const totalDaysElement = document.getElementById("totalDays");
        const sundaysElement = document.getElementById("sundays");
        const workDaysElement = document.getElementById("workDays");
        const salaryElement = document.getElementById("salary");
        const errorElement = document.getElementById("error");

        /* СТВОРЕННЯ СПИСКУ РОКІВ */

        const currentDate = new Date();
        const currentYear = currentDate.getFullYear();

        for (
            let year = currentYear - 10;
            year <= currentYear + 10;
            year++
        ) {
            const option = document.createElement("option");

            option.value = year;
            option.textContent = year;

            if (year === currentYear) {
                option.selected = true;
            }

            yearSelect.appendChild(option);
        }

        /* ПОТОЧНИЙ МІСЯЦЬ */

        monthSelect.value = currentDate.getMonth();

        /* ПЕРЕМИКАННЯ РЕЖИМІВ */

        monthModeBtn.addEventListener("click", function() {

            monthModeBtn.classList.add("active");
            periodModeBtn.classList.remove("active");

            monthMode.classList.add("active");
            customMode.classList.remove("active");

            calculateMonth();
        });

        periodModeBtn.addEventListener("click", function() {

            periodModeBtn.classList.add("active");
            monthModeBtn.classList.remove("active");

            customMode.classList.add("active");
            monthMode.classList.remove("active");

            calculatePeriod();
        });

        /* НАЛАШТУВАННЯ АВАНСУ */

        advanceEnabled.addEventListener("change", function() {

            advanceSettings.style.display =
                advanceEnabled.checked ? "block" : "none";

            recalculate();
        });

        /* ОТРИМАННЯ ЗАРПЛАТИ ЗА ДЕНЬ */

        function getSalaryPerDay() {

            const value = Number(salaryPerDayInput.value);

            if (salaryPerDayInput.value.trim() === "" || !Number.isFinite(value)) {
                return defaultSalaryPerDay;
            }

            return Math.max(0, value);
        }

        /* ОТРИМАННЯ СУМИ АВАНСУ */

        function getAdvanceAmount() {

            const value = Number(advanceAmountInput.value);

            if (advanceAmountInput.value.trim() === "" || !Number.isFinite(value)) {
                return defaultAdvance;
            }

            return Math.max(0, value);
        }

        /* РОЗРАХУНОК ОДНОГО МІСЯЦЯ */

        function calculateMonth() {

            errorElement.textContent = "";

            const month = Number(monthSelect.value);
            const year = Number(yearSelect.value);

            const totalDays = new Date(year, month + 1, 0).getDate();

            let sundays = 0;

            for (let day = 1; day <= totalDays; day++) {

                const date = new Date(year, month, day);

                if (date.getDay() === 0) {
                    sundays++;
                }
            }

            const missedDays = Number(missedDaysSelect.value);

            const workDays = Math.max(
                0,
                totalDays - sundays - missedDays
            );

            showResult(totalDays, sundays, workDays);
        }

        /* РОЗРАХУНОК ВЛАСНОГО ПЕРІОДУ */

        function calculatePeriod() {

            errorElement.textContent = "";

            if (!startDateInput.value || !endDateInput.value) {
                clearResult();
                return;
            }

            const startDate = new Date(startDateInput.value);
            const endDate = new Date(endDateInput.value);

            if (startDate > endDate) {

                clearResult();

                errorElement.textContent =
                    "Дата початку не може бути пізніше дати завершення.";

                return;
            }

            let totalDays = 0;
            let sundays = 0;

            const currentDate = new Date(startDate);

            while (currentDate <= endDate) {

                totalDays++;

                if (currentDate.getDay() === 0) {
                    sundays++;
                }

                currentDate.setDate(currentDate.getDate() + 1);
            }

            const missedDays = Number(missedDaysSelect.value);

            const workDays = Math.max(
                0,
                totalDays - sundays - missedDays
            );

            showResult(totalDays, sundays, workDays);
        }

        /* ПОКАЗ РЕЗУЛЬТАТУ */

        function showResult(totalDays, sundays, workDays) {

            const salaryPerDay = getSalaryPerDay();

            let salary = workDays * salaryPerDay;

            if (advanceEnabled.checked) {
                salary -= getAdvanceAmount();
            }

            salary = Math.max(0, salary);

            totalDaysElement.textContent = totalDays;
            sundaysElement.textContent = sundays;
            workDaysElement.textContent = workDays;

            salaryElement.textContent = salary.toLocaleString("uk-UA", {
                maximumFractionDigits: 2
            });
        }

        /* ОЧИЩЕННЯ РЕЗУЛЬТАТУ */

        function clearResult() {

            totalDaysElement.textContent = 0;
            sundaysElement.textContent = 0;
            workDaysElement.textContent = 0;
            salaryElement.textContent = "0";
        }

        /* ПОВТОРНИЙ РОЗРАХУНОК АКТИВНОГО РЕЖИМУ */

        function recalculate() {

            if (monthMode.classList.contains("active")) {
                calculateMonth();
            } else {
                calculatePeriod();
            }
        }

        /* ПОДІЇ */

        monthSelect.addEventListener("change", calculateMonth);
        yearSelect.addEventListener("change", calculateMonth);

        startDateInput.addEventListener("change", calculatePeriod);
        endDateInput.addEventListener("change", calculatePeriod);

        salaryPerDayInput.addEventListener("input", recalculate);
        advanceAmountInput.addEventListener("input", recalculate);
        missedDaysSelect.addEventListener("change", recalculate);

        /* ПОЧАТКОВИЙ РОЗРАХУНОК */

        salaryPerDayInput.value = defaultSalaryPerDay;
        advanceAmountInput.value = defaultAdvance;

        calculateMonth();

    </script>

</body>
</html>
