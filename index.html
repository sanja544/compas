<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Компас населених пунктів</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: #f5f5f5;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      height: 100vh;
    }

    #top {
      z-index: 1000;
      padding: 10px 12px;
      background: white;
      box-shadow: 0 2px 7px #0002;
    }

    #title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    #status {
      font-size: 13px;
      line-height: 1.4;
      color: #333;
      overflow-wrap: anywhere;
    }

    #controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 12px;
      background: #1769d2;
      color: white;
      font-size: 14px;
      font-weight: 600;
    }

    button:disabled {
      opacity: .55;
    }

    #mapWrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 150px;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #e8edf0;
    }

    /*
      Стрілка нерухома відносно екрана.
      Лінія починається вище маркера, тому не перекриває GPS-точку.
    */
    #directionOverlay {
      position: absolute;
      inset: 0;
      z-index: 700;
      pointer-events: none;
      overflow: hidden;
    }

    #directionLine {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: calc(50% - 17px);
      background: rgba(220, 25, 25, .85);
      transform: translateX(-50%);
    }

    #directionTip {
      position: absolute;
      left: 50%;
      top: calc(50% - 17px);
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 9px solid rgba(220, 25, 25, .9);
    }

    /* GPS-маркер завжди поверх стрілки */
    .leaflet-marker-pane {
      z-index: 750 !important;
    }

    .my-location {
      width: 16px;
      height: 16px;
      border: 3px solid white;
      border-radius: 50%;
      background: #1677ff;
      box-shadow: 0 0 0 2px #1677ff, 0 1px 6px #0007;
    }

    #bottom {
      flex: 0 0 32%;
      min-height: 130px;
      max-height: 42%;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    #listHeader {
      padding: 9px 12px;
      font-weight: 700;
      font-size: 14px;
      border-bottom: 1px solid #eee;
    }

    #settlementList {
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 12px 8px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .itemName {
      overflow-wrap: anywhere;
    }

    .distance {
      white-space: nowrap;
      color: #444;
      font-size: 13px;
    }

    #empty {
      padding: 12px 0;
      color: #555;
      font-size: 13px;
      line-height: 1.45;
    }

    .leaflet-control-attribution {
      font-size: 9px !important;
    }
  </style>
</head>

<body>
<div id="app">
  <div id="top">
    <div id="title">Компас населених пунктів</div>
    <div id="status">Натисніть «Увімкнути GPS» і дозвольте доступ до місцезнаходження.</div>
    <div id="controls">
      <button id="startBtn">Увімкнути GPS</button>
      <button id="compassBtn">Увімкнути компас</button>
      <button id="refreshBtn">Оновити список</button>
    </div>
  </div>

  <div id="mapWrap">
    <div id="map"></div>
    <div id="directionOverlay" aria-hidden="true">
      <div id="directionLine"></div>
      <div id="directionTip"></div>
    </div>
  </div>

  <div id="bottom">
    <div id="listHeader">Населені пункти в напрямку стрілки — ±1°, до 50 км</div>
    <div id="settlementList">
      <div id="empty">Очікування GPS і компаса…</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@tomickigrzegorz/leaflet-rotate/dist/leaflet-rotate.umd.min.js"></script>

<script>
(() => {
  "use strict";

  const MAX_DISTANCE_M = 50000;
  const ANGLE_TOLERANCE = 1;
  const REFRESH_INTERVAL_MS = 60000;
  const MIN_MOVE_TO_REFRESH_M = 1000;

  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("settlementList");
  const startBtn = document.getElementById("startBtn");
  const compassBtn = document.getElementById("compassBtn");
  const refreshBtn = document.getElementById("refreshBtn");

  let position = null;
  let heading = null;
  let gpsWatchId = null;
  let compassStarted = false;
  let lastFetchTime = 0;
  let lastFetchPosition = null;
  let fetchInProgress = false;
  let fetchAgain = false;
  let settlements = [];
  let activeOverpassController = null;
  let lastHeadingUpdate = null;

  const map = L.map("map", {
    zoomControl: true,
    rotate: true,
    touchRotate: false,
    shiftKeyRotate: false,
    dragRotate: false,
    attributionControl: true
  }).setView([49, 31], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  const myIcon = L.divIcon({
    className: "",
    html: '<div class="my-location"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });

  let myMarker = null;

  function setStatus(message) {
    statusEl.textContent = message;
  }

  function normalizeAngle(angle) {
    return ((angle % 360) + 360) % 360;
  }

  function angleDifference(a, b) {
    return Math.abs(((a - b + 540) % 360) - 180);
  }

  function distanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = Math.PI / 180;
    const p1 = lat1 * toRad;
    const p2 = lat2 * toRad;
    const dp = (lat2 - lat1) * toRad;
    const dl = (lon2 - lon1) * toRad;

    const a = Math.sin(dp / 2) ** 2 +
      Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;

    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function bearingDegrees(lat1, lon1, lat2, lon2) {
    const toRad = Math.PI / 180;
    const toDeg = 180 / Math.PI;
    const p1 = lat1 * toRad;
    const p2 = lat2 * toRad;
    const dl = (lon2 - lon1) * toRad;

    const y = Math.sin(dl) * Math.cos(p2);
    const x = Math.cos(p1) * Math.sin(p2) -
      Math.sin(p1) * Math.cos(p2) * Math.cos(dl);

    return normalizeAngle(Math.atan2(y, x) * toDeg);
  }

  function formatDistance(meters) {
    if (meters < 1000) return Math.round(meters) + " м";
    return (meters / 1000).toFixed(1).replace(".", ",") + " км";
  }

  function getElementCenter() {
    const rect = document.getElementById("mapWrap").getBoundingClientRect();
    return {
      x: rect.left + rect.width / 2,
      y: rect.top + rect.height / 2
    };
  }

  function updateMapHeading() {
    if (heading === null) return;

    /*
      setHeading() — heading-up: напрямок компаса стає верхом карти.
      Стрілка не обертається CSS-ом: вона завжди дивиться на верх екрана.
    */
    if (typeof map.setHeading === "function") {
      map.setHeading(heading, { ease: 0.35, deadzone: 0 });
    } else {
      setStatus("Помилка: плагін обертання карти не завантажився. Перезавантажте сторінку.");
    }

    if (lastHeadingUpdate === null ||
        angleDifference(heading, lastHeadingUpdate) >= 0.2) {
      lastHeadingUpdate = heading;
      renderSettlementList();
    }
  }

  function updateGPSPosition(lat, lon, accuracy) {
    const previousPosition = position;
    position = { lat, lon };

    if (!myMarker) {
      myMarker = L.marker([lat, lon], {
        icon: myIcon,
        keyboard: false,
        interactive: false,
        zIndexOffset: 1000
      }).addTo(map);

      map.setView([lat, lon], 11);
    } else {
      myMarker.setLatLng([lat, lon]);
      map.panTo([lat, lon], { animate: false });
    }

    if (heading !== null) updateMapHeading();

    const accuracyText = Number.isFinite(accuracy)
      ? " Точність GPS: ±" + Math.round(accuracy) + " м."
      : "";

    setStatus(
      "GPS: " + lat.toFixed(5) + ", " + lon.toFixed(5) +
      (heading === null ? ". Очікування компаса." :
        ". Азимут: " + heading.toFixed(1) + "°.") +
      accuracyText
    );

    const movedEnough = !lastFetchPosition ||
      distanceMeters(
        lastFetchPosition.lat, lastFetchPosition.lon, lat, lon
      ) >= MIN_MOVE_TO_REFRESH_M;

    if (!previousPosition || movedEnough ||
        Date.now() - lastFetchTime >= REFRESH_INTERVAL_MS) {
      loadSettlements();
    } else {
      renderSettlementList();
    }
  }

  function startGPS() {
    if (!("geolocation" in navigator)) {
      setStatus("Цей браузер не підтримує геолокацію.");
      return;
    }

    if (gpsWatchId !== null) {
      navigator.geolocation.clearWatch(gpsWatchId);
    }

    setStatus("Запит GPS… Дозвольте доступ до місцезнаходження.");

    gpsWatchId = navigator.geolocation.watchPosition(
      (p) => {
        updateGPSPosition(
          p.coords.latitude,
          p.coords.longitude,
          p.coords.accuracy
        );
      },
      (err) => {
        setStatus("Помилка GPS: " + err.message +
          ". Перевірте дозвіл на геолокацію та HTTPS.");
      },
      {
        enableHighAccuracy: true,
        maximumAge: 3000,
        timeout: 20000
      }
    );

    startBtn.textContent = "GPS увімкнено";
  }

  function handleOrientation(event) {
    let compassHeading = null;

    // Safari на iPhone надає готовий компасний азимут.
    if (typeof event.webkitCompassHeading === "number" &&
        Number.isFinite(event.webkitCompassHeading)) {
      compassHeading = event.webkitCompassHeading;
    } else {
      // На Android використовуємо абсолютний датчик, якщо доступний.
      if (event.absolute === true &&
          typeof event.alpha === "number" &&
          Number.isFinite(event.alpha)) {
        compassHeading = 360 - event.alpha;
      }
    }

    if (compassHeading === null) return;

    heading = normalizeAngle(compassHeading);
    updateMapHeading();

    if (position) renderSettlementList();
  }

  async function startCompass() {
    if (compassStarted) return;

    try {
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        const permission = await DeviceOrientationEvent.requestPermission();

        if (permission !== "granted") {
          setStatus("Доступ до компаса не дозволено.");
          return;
        }
      }

      window.addEventListener("deviceorientation", handleOrientation, true);
      window.addEventListener("deviceorientationabsolute", handleOrientation, true);

      compassStarted = true;
      compassBtn.textContent = "Компас увімкнено";

      setStatus("Компас увімкнено. Потримайте телефон горизонтально для точнішого напрямку.");
    } catch (error) {
      setStatus("Не вдалося ввімкнути компас: " + error.message);
    }
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[ch]);
  }

  function settlementName(tags) {
    return tags.name ||
      tags["name:uk"] ||
      tags["name:en"] ||
      tags["name:ru"] ||
      tags["official_name"] ||
      tags["alt_name"] ||
      null;
  }

  function getElementCoordinates(element) {
    if (typeof element.lat === "number" &&
        typeof element.lon === "number") {
      return { lat: element.lat, lon: element.lon };
    }

    if (element.center &&
        typeof element.center.lat === "number" &&
        typeof element.center.lon === "number") {
      return { lat: element.center.lat, lon: element.center.lon };
    }

    return null;
  }

  function isSettlement(element) {
    const place = element.tags && element.tags.place;
    return ["city", "town", "village", "hamlet", "isolated_dwelling"].includes(place);
  }

  async function fetchOverpass(lat, lon) {
    const query = `
      [out:json][timeout:45];
      (
        node(around:${MAX_DISTANCE_M},${lat},${lon})["place"~"^(city|town|village|hamlet|isolated_dwelling)$"];
        way(around:${MAX_DISTANCE_M},${lat},${lon})["place"~"^(city|town|village|hamlet|isolated_dwelling)$"];
        relation(around:${MAX_DISTANCE_M},${lat},${lon})["place"~"^(city|town|village|hamlet|isolated_dwelling)$"];
      );
      out center tags;
    `;

    const endpoints = [
      "https://overpass-api.de/api/interpreter",
      "https://overpass.kumi.systems/api/interpreter",
      "https://overpass.private.coffee/api/interpreter"
    ];

    let lastError = null;

    for (const endpoint of endpoints) {
      const controller = new AbortController();
      activeOverpassController = controller;
      const timeout = setTimeout(() => controller.abort(), 50000);

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
          },
          body: "data=" + encodeURIComponent(query),
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error("Overpass HTTP " + response.status);
        }

        const data = await response.json();
        clearTimeout(timeout);
        activeOverpassController = null;
        return data.elements || [];
      } catch (error) {
        clearTimeout(timeout);
        lastError = error;
        activeOverpassController = null;
      }
    }

    throw lastError || new Error("Усі сервери Overpass недоступні");
  }

  async function loadSettlements(force = false) {
    if (!position) {
      setStatus("Спочатку увімкніть GPS.");
      return;
    }

    if (fetchInProgress) {
      fetchAgain = true;
      return;
    }

    const now = Date.now();
    const moved = !lastFetchPosition ||
      distanceMeters(
        lastFetchPosition.lat, lastFetchPosition.lon,
        position.lat, position.lon
      ) >= MIN_MOVE_TO_REFRESH_M;

    if (!force && !moved && now - lastFetchTime < REFRESH_INTERVAL_MS) {
      renderSettlementList();
      return;
    }

    fetchInProgress = true;
    fetchAgain = false;
    lastFetchTime = now;
    lastFetchPosition = { ...position };

    listEl.innerHTML = '<div id="empty">Завантаження населених пунктів у радіусі 50 км…</div>';
    setStatus("Шукаю населені пункти в радіусі 50 км…");

    try {
      const elements = await fetchOverpass(position.lat, position.lon);
      const unique = new Map();

      for (const element of elements) {
        if (!isSettlement(element)) continue;

        const name = settlementName(element.tags || {});
        const coords = getElementCoordinates(element);
        if (!name || !coords) continue;

        const distance = distanceMeters(
          position.lat, position.lon, coords.lat, coords.lon
        );

        if (distance > MAX_DISTANCE_M) continue;

        const key = element.type + "/" + element.id;
        unique.set(key, {
          id: key,
          name,
          lat: coords.lat,
          lon: coords.lon,
          distance,
          bearing: bearingDegrees(
            position.lat, position.lon, coords.lat, coords.lon
          ),
          place: element.tags.place || ""
        });
      }

      settlements = Array.from(unique.values());
      renderSettlementList();

      if (settlements.length === 0) {
        listEl.innerHTML =
          '<div id="empty">У радіусі 50 км не знайдено населених пунктів з назвами. Спробуйте оновити список пізніше.</div>';
      }

      setStatus(
        "Знайдено об’єктів: " + settlements.length +
        ". " + (heading === null
          ? "Увімкніть компас, щоб відфільтрувати їх за напрямком."
          : "Напрямок: " + heading.toFixed(1) + "°. Сектор: ±1°.")
      );
    } catch (error) {
      listEl.innerHTML =
        '<div id="empty">Не вдалося завантажити дані. Перевірте інтернет і натисніть «Оновити список». Причина: ' +
        escapeHTML(error.message || "невідома помилка") + '</div>';

      setStatus("Помилка завантаження даних населених пунктів: " +
        (error.message || "невідома помилка"));
    } finally {
      fetchInProgress = false;

      if (fetchAgain) {
        fetchAgain = false;
        loadSettlements(true);
      }
    }
  }

  function renderSettlementList() {
    if (!position) return;

    if (heading === null) {
      listEl.innerHTML =
        '<div id="empty">Населені пункти завантажуються, але для відбору за напрямком потрібно увімкнути компас.</div>';
      return;
    }

    const matching = settlements
      .map(s => ({
        ...s,
        angleDiff: angleDifference(s.bearing, heading)
      }))
      .filter(s =>
        s.distance <= MAX_DISTANCE_M &&
        s.angleDiff <= ANGLE_TOLERANCE
      )
      .sort((a, b) => a.distance - b.distance);

    if (!matching.length) {
      listEl.innerHTML =
        '<div id="empty">У секторі ±1° попереду немає знайдених населених пунктів у межах 50 км. Поверніть телефон або натисніть «Оновити список».<br><br>Усього завантажено в радіусі 50 км: ' +
        settlements.length + '.</div>';
      return;
    }

    listEl.innerHTML = "";

    for (const s of matching) {
      const item = document.createElement("div");
      item.className = "item";

      const name = document.createElement("div");
      name.className = "itemName";
      name.textContent = s.name;

      const distance = document.createElement("div");
      distance.className = "distance";
      distance.textContent = formatDistance(s.distance);

      item.appendChild(name);
      item.appendChild(distance);

      item.addEventListener("click", () => {
        map.setView([s.lat, s.lon], 14);
      });

      listEl.appendChild(item);
    }
  }

  startBtn.addEventListener("click", startGPS);
  compassBtn.addEventListener("click", startCompass);
  refreshBtn.addEventListener("click", () => loadSettlements(true));

  map.whenReady(() => {
    if (typeof map.setHeading !== "function") {
      setStatus("Не завантажився модуль обертання карти. Перевірте інтернет і CDN.");
    }
  });

  // Виправляємо розміри карти після зміни висоти екрана.
  window.addEventListener("resize", () => {
    setTimeout(() => map.invalidateSize(), 100);
  });
})();
</script>
</body>
</html>
