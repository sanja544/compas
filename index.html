
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Компас населених пунктів</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}
header { padding: 14px; }
h2 { margin: 0 0 8px; font-size: 21px; }
.status { color: #b8c5d8; font-size: 13px; margin: 8px 0; }
.controls { padding: 0 12px 12px; }
input, button {
  width: 100%;
  padding: 12px;
  margin: 4px 0;
  border-radius: 8px;
  border: 1px solid #526078;
  font-size: 16px;
}
input { background: #fff; color: #111; }
button {
  background: #2563eb;
  color: white;
  border: 0;
  font-weight: bold;
}
button.secondary { background: #374151; }
.info {
  padding: 10px 12px;
  font-size: 14px;
  line-height: 1.6;
}
#map { width: 100%; height: 49vh; min-height: 300px; }
#places { padding: 0 12px 18px; }
.place {
  background: #263244;
  padding: 10px;
  border-radius: 8px;
  margin: 6px 0;
  font-size: 14px;
}
.place button { margin-top: 7px; }
.arrow {
  color: #e11d48;
  font-size: 42px;
  font-weight: bold;
  text-shadow: 0 0 3px white, 0 0 5px white;
  width: 48px;
  height: 48px;
  text-align: center;
  line-height: 48px;
  transform-origin: center;
}
.small { font-size: 12px; color: #bdc8d8; }
</style>
</head>

<body>
<header>
  <h2>Компас населених пунктів</h2>
  <div class="status" id="status">
    Натисни «Увімкнути GPS», щоб визначити місце.
  </div>
</header>

<div class="controls">
  <button id="gpsBtn">Увімкнути GPS</button>
  <button id="compassBtn" class="secondary">
    Увімкнути компас
  </button>

  <input id="search" type="search"
    placeholder="Назва села або міста">

  <button id="searchBtn">Знайти населений пункт</button>
  <button id="clearBtn" class="secondary">
    Скасувати пошук і показати напрямок компаса
  </button>
</div>

<div class="info">
  <div>Напрямок телефона: <b id="heading">—</b></div>
  <div>Координати: <b id="coords">—</b></div>
  <div>Ціль: <b id="target">Не вибрана</b></div>
  <div id="distance">Відстань: —</div>
  <div class="small">
    Населені пункти: у секторі ±15° від стрілки, до 50 км.
    Компас залежить від датчиків телефона.
  </div>
</div>

<div id="map"></div>

<section id="places">
  <h3>Населені пункти в напрямку стрілки</h3>
  <div id="list" class="status">
    Очікується визначення координат.
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const $ = id => document.getElementById(id);

const map = L.map('map').setView([48.5, 31.2], 6);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let position = null;
let heading = null;
let target = null;
let gpsWatch = null;
let settlements = [];
let placeLayer = L.layerGroup().addTo(map);
let directionLine = null;
let targetLine = null;
let userMarker = null;
let arrowMarker = null;
let sectorLayer = null;
let loadingPlaces = false;
let lastPlacesQuery = 0;

const R = 6371000;
const MAX_DISTANCE = 50000;
const HALF_ANGLE = 15;

function setStatus(text) {
  $('status').textContent = text;
}

function radians(deg) {
  return deg * Math.PI / 180;
}

function degrees(rad) {
  return rad * 180 / Math.PI;
}

function normalize(deg) {
  return (deg % 360 + 360) % 360;
}

function distanceBetween(a, b) {
  const p1 = radians(a.lat);
  const p2 = radians(b.lat);
  const dp = radians(b.lat - a.lat);
  const dl = radians(b.lng - a.lng);

  const h = Math.sin(dp / 2) ** 2 +
    Math.cos(p1) * Math.cos(p2) *
    Math.sin(dl / 2) ** 2;

  return 2 * R * Math.asin(Math.sqrt(h));
}

function bearingBetween(a, b) {
  const p1 = radians(a.lat);
  const p2 = radians(b.lat);
  const dl = radians(b.lng - a.lng);

  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) -
    Math.sin(p1) * Math.cos(p2) * Math.cos(dl);

  return normalize(degrees(Math.atan2(y, x)));
}

function destinationPoint(start, bearing, distance) {
  const br = radians(bearing);
  const d = distance / R;
  const p1 = radians(start.lat);
  const l1 = radians(start.lng);

  const p2 = Math.asin(
    Math.sin(p1) * Math.cos(d) +
    Math.cos(p1) * Math.sin(d) * Math.cos(br)
  );

  const l2 = l1 + Math.atan2(
    Math.sin(br) * Math.sin(d) * Math.cos(p1),
    Math.cos(d) - Math.sin(p1) * Math.sin(p2)
  );

  return {
    lat: degrees(p2),
    lng: degrees(l2)
  };
}

function formatDistance(m) {
  return m < 1000
    ? Math.round(m) + ' м'
    : (m / 1000).toFixed(1) + ' км';
}

function formatBearing(b) {
  const names = [
    'Пн', 'ПнСх', 'Сх', 'ПдСх',
    'Пд', 'ПдЗх', 'Зх', 'ПнЗх'
  ];
  return Math.round(b) + '° (' +
    names[Math.round(b / 45) % 8] + ')';
}

function angularDifference(a, b) {
  return Math.abs(((a - b + 540) % 360) - 180);
}

function updateMap() {
  if (!position) return;

  if (!userMarker) {
    userMarker = L.circleMarker(position, {
      radius: 8,
      color: '#fff',
      weight: 3,
      fillColor: '#2563eb',
      fillOpacity: 1
    }).addTo(map).bindPopup('Твоє місце');
  } else {
    userMarker.setLatLng(position);
  }

  $('coords').textContent =
    position.lat.toFixed(5) + ', ' +
    position.lng.toFixed(5);

  if (heading !== null && !target) {
    const end = destinationPoint(position, heading, MAX_DISTANCE);

    if (directionLine) map.removeLayer(directionLine);
    directionLine = L.polyline([position, end], {
      color: '#e11d48',
      weight: 4,
      opacity: 0.8
    }).addTo(map);

    if (arrowMarker) map.removeLayer(arrowMarker);

    arrowMarker = L.marker(position, {
      icon: L.divIcon({
        className: '',
        html: '<div class="arrow" style="transform:rotate(' +
          heading + 'deg)">↑</div>',
        iconSize: [48, 48],
        iconAnchor: [24, 24]
      }),
      interactive: false
    }).addTo(map);

    $('heading').textContent = formatBearing(heading);
    $('distance').textContent =
      'Лінія показує напрямок до 50 км, а не місце вибуху.';

    drawSector();
    renderSettlements();
  }

  if (target) updateTargetLine();
}

function drawSector() {
  if (!position || heading === null || target) return;

  if (sectorLayer) map.removeLayer(sectorLayer);

  const points = [position];

  for (let a = -HALF_ANGLE; a <= HALF_ANGLE; a += 3) {
    points.push(destinationPoint(
      position, normalize(heading + a), MAX_DISTANCE
    ));
  }

  points.push(position);

  sectorLayer = L.polygon(points, {
    color: '#f59e0b',
    weight: 1,
    fillColor: '#f59e0b',
    fillOpacity: 0.10
  }).addTo(map);
}

function renderSettlements() {
  if (!position || heading === null || target) return;

  placeLayer.clearLayers();

  const found = settlements.map(s => {
    const d = distanceBetween(position, s);
    const b = bearingBetween(position, s);
    return { ...s, d, b, diff: angularDifference(b, heading) };
  }).filter(s =>
    s.d <= MAX_DISTANCE && s.diff <= HALF_ANGLE
  ).sort((a, b) => a.d - b.d);

  const list = $('list');
  list.innerHTML = '';

  if (!found.length) {
    list.textContent =
      'У цьому секторі населених пунктів не знайдено. ' +
      'Дані карти можуть бути неповними.';
    return;
  }

  found.slice(0, 100).forEach(s => {
    const marker = L.circleMarker([s.lat, s.lng], {
      radius: 5,
      color: '#111827',
      fillColor: '#f59e0b',
      fillOpacity: 1
    }).addTo(placeLayer);

    marker.bindPopup(
      '<b>' + escapeHtml(s.name) + '</b><br>' +
      formatDistance(s.d) + '<br>' + formatBearing(s.b)
    );

    const div = document.createElement('div');
    div.className = 'place';

    const title = document.createElement('b');
    title.textContent = s.name;

    const detail = document.createElement('div');
    detail.textContent = formatDistance(s.d) +
      ' · ' + formatBearing(s.b);

    const btn = document.createElement('button');
    btn.textContent = 'Показати на карті';
    btn.onclick = () => {
      map.setView([s.lat, s.lng], 11);
      marker.openPopup();
    };

    div.append(title, detail, btn);
    list.appendChild(div);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;'
  })[c]);
}

async function loadSettlements() {
  if (!position || loadingPlaces) return;

  // Не повторювати запит надто часто.
  if (Date.now() - lastPlacesQuery < 60000) return;

  loadingPlaces = true;
  lastPlacesQuery = Date.now();
  $('list').textContent = 'Завантаження даних OpenStreetMap…';

  const query = `
    [out:json][timeout:35];
    (
      node(around:50000,${position.lat},${position.lng})
        ["place"~"city|town|village|hamlet"];
      way(around:50000,${position.lat},${position.lng})
        ["place"~"city|town|village|hamlet"];
      relation(around:50000,${position.lat},${position.lng})
        ["place"~"city|town|village|hamlet"];
    );
    out center tags;
  `;

  try {
    const response = await fetch(
      'https://overpass-api.de/api/interpreter',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: 'data=' + encodeURIComponent(query)
      }
    );

    if (!response.ok) throw new Error('Помилка Overpass API');

    const data = await response.json();
    const unique = new Map();

    for (const e of data.elements || []) {
      const lat = e.lat ?? e.center?.lat;
      const lng = e.lon ?? e.center?.lon;
      const name = e.tags?.['name:uk'] ||
        e.tags?.name || e.tags?.['name:en'];

      if (lat == null || lng == null || !name) continue;

      const key = name + ':' + lat.toFixed(4) + ':' + lng.toFixed(4);

      unique.set(key, { name, lat, lng });
    }

    settlements = [...unique.values()];
    renderSettlements();

    if (target) {
      $('list').textContent =
        'Пошук напрямку до вибраного населеного пункту активний.';
    }
  } catch (err) {
    $('list').textContent =
      'Не вдалося завантажити населені пункти. ' +
      'Перевір інтернет і спробуй пізніше.';
    console.error(err);
  } finally {
    loadingPlaces = false;
  }
}

$('gpsBtn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    setStatus('Цей браузер не підтримує GPS.');
    return;
  }

  if (gpsWatch !== null) {
    navigator.geolocation.clearWatch(gpsWatch);
  }

  setStatus('Очікування GPS…');

  gpsWatch = navigator.geolocation.watchPosition(
    async p => {
      position = {
        lat: p.coords.latitude,
        lng: p.coords.longitude
      };

      updateMap();

      if (!target) {
        map.setView(position, 10);
      }

      setStatus(
        'GPS працює. Точність: приблизно ' +
        Math.round(p.coords.accuracy) + ' м.'
      );

      if (lastPlacesQuery === 0) await loadSettlements();
    },
    err => {
      setStatus('GPS недоступний: ' + err.message +
        '. Перевір дозвіл на місцезнаходження.');
    },
    {
      enableHighAccuracy: true,
      maximumAge: 3000,
      timeout: 20000
    }
  );
});

$('compassBtn').addEventListener('click', async () => {
  try {
    if (typeof DeviceOrientationEvent === 'undefined') {
      setStatus('Компас не підтримується цим браузером.');
      return;
    }

    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      const permission =
        await DeviceOrientationEvent.requestPermission(true);

      if (permission !== 'granted') {
        setStatus('Доступ до компаса не надано.');
        return;
      }
    }

    window.addEventListener('deviceorientation', handleOrientation, true);
    window.addEventListener(
      'deviceorientationabsolute', handleOrientation, true
    );

    setStatus('Датчики компаса увімкнено. Поверни телефон.');
  } catch (err) {
    setStatus('Не вдалося ввімкнути компас: ' + err.message);
  }
});

let lastHeading = null;

function handleOrientation(e) {
  // iPhone Safari має спеціальну властивість компаса.
  if (typeof e.webkitCompassHeading === 'number') {
    heading = normalize(e.webkitCompassHeading);
  } else if (e.absolute && typeof e.alpha === 'number') {
    // Для багатьох Android-пристроїв це приблизний напрямок.
    // У деяких моделях потрібне інше калібрування.
    heading = normalize(360 - e.alpha);
  } else {
    if (lastHeading === null && typeof e.alpha === 'number') {
      lastHeading = e.alpha;
    }

    $('heading').textContent =
      'Немає абсолютного компаса — перевір підтримку телефона';
    return;
  }

  lastHeading = heading;
  updateMap();
}

$('searchBtn').addEventListener('click', searchPlace);

$('search').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchPlace();
});

async function searchPlace() {
  const name = $('search').value.trim();

  if (!name) {
    setStatus('Введи назву населеного пункту.');
    return;
  }

  $('target').textContent = 'Пошук…';
  setStatus('Шукаю населений пункт…');

  try {
    const url = new URL('https://nominatim.openstreetmap.org/search');
    url.searchParams.set('q', name);
    url.searchParams.set('format', 'jsonv2');
    url.searchParams.set('limit', '5');
    url.searchParams.set('countrycodes', 'ua');

    const response = await fetch(url);
    if (!response.ok) throw new Error('Помилка пошуку');

    const results = await response.json();

    if (!results.length) {
      $('target').textContent = 'Не знайдено';
      setStatus('Населений пункт не знайдено.');
      return;
    }

    const choices = results.map((r, i) =>
      `${i + 1}. ${r.display_name}`
    ).join('\n');

    const choice = results.length === 1
      ? 0
      : Number(prompt('Вибери результат:\n' + choices)) - 1;

    if (!Number.isInteger(choice) ||
        choice < 0 || choice >= results.length) return;

    const r = results[choice];

    target = {
      lat: Number(r.lat),
      lng: Number(r.lon),
      name: r.display_name
    };

    $('target').textContent = target.name;
    updateTargetLine();

    map.fitBounds([
      position || target,
      target
    ], { padding: [30, 30] });

    setStatus('Напрямок до вибраного населеного пункту показано.');
  } catch (err) {
    setStatus('Помилка пошуку. Перевір інтернет і повтори спробу.');
    console.error(err);
  }
}

function updateTargetLine() {
  if (!position || !target) return;

  const d = distanceBetween(position, target);
  const b = bearingBetween(position, target);

  if (targetLine) map.removeLayer(targetLine);

  targetLine = L.polyline([position, target], {
    color: '#16a34a',
    weight: 5
  }).addTo(map);

  $('distance').textContent =
    'До цілі: ' + formatDistance(d) +
    ' · напрямок ' + formatBearing(b);

  if (arrowMarker) map.removeLayer(arrowMarker);

  arrowMarker = L.marker(position, {
    icon: L.divIcon({
      className: '',
      html: '<div class="arrow" style="color:#16a34a;transform:rotate(' +
        b + 'deg)">↑</div>',
      iconSize: [48, 48],
      iconAnchor: [24, 24]
    }),
    interactive: false
  }).addTo(map);
}

$('clearBtn').addEventListener('click', () => {
  target = null;

  if (targetLine) map.removeLayer(targetLine);
  targetLine = null;

  if (sectorLayer) map.removeLayer(sectorLayer);
  sectorLayer = null;

  $('target').textContent = 'Не вибрана';

  if (position) {
    updateMap();
    map.setView(position, 10);
    renderSettlements();
  }
});
</script>
</body>
</html>
